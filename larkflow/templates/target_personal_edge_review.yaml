schema_version: "0.2"
template:
  id: target_personal_edge_review
  version: 1
  name: 本机只读 Agent 摘要复核
  status: draft
  locked: false
goal: 人工确认输入，本机只读 Agent 生成草稿，人工完成复核
parameters:
  brief:
    type: text
    required: true
nodes:
  - id: confirm_brief
    title: 确认生成要求
    owner_role: project_owner
    executor: human
    deps: []
    work:
      objective: 确认流程输入可以交给本人设备上的只读 Agent 处理
      inputs:
        - instance_inputs.brief
      outputs:
        - id: confirmation
          type: data
      acceptance:
        - 已确认生成要求和本机只读边界

  - id: local_draft
    title: 本机生成执行摘要
    owner_role: project_owner
    executor: agent
    deps:
      - confirm_brief
    work:
      objective: 结合已确认输入和当前本机工作区生成执行摘要
      inputs:
        - instance_inputs.brief
        - dependencies.confirm_brief
      outputs:
        - id: content
          type: text
      acceptance:
        - 正文包含明确结论和后续行动
        - 正文不虚构未提供的事实
        - 执行期间不修改本机文件
      agent:
        kind: personal.readonly
        instructions: 用中文生成不超过 300 字的执行摘要，包含结论、依据和下一步。

  - id: review_draft
    title: 复核本机 Agent 摘要
    owner_role: project_owner
    executor: human
    deps:
      - local_draft
    work:
      objective: 复核本机 Agent 结果并决定是否接受
      inputs:
        - dependencies.local_draft
      outputs:
        - id: review
          type: data
      acceptance:
        - 已阅读任务描述中的上游结果
        - 已完成接受或退回判断
