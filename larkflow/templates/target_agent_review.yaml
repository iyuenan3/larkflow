schema_version: "0.2"
instance_id: replace_with_unique_instance_id
owner_person_id: replace_with_open_id
goal: 人工确认输入，Agent 生成草稿，人工完成复核
inputs:
  brief: 请根据本次测试目标生成一份简短、可核验的执行摘要。
nodes:
  - key: confirm_brief
    title: 确认生成要求
    owner_person_id: replace_with_open_id
    executor: human
    deps: []
    work:
      objective: 确认流程输入中的生成要求可以交给 Agent 处理
      inputs:
        - instance_inputs.brief
      outputs:
        - id: confirmation
          type: data
      acceptance:
        - 已确认生成要求

  - key: draft_summary
    title: 生成执行摘要
    owner_person_id: replace_with_open_id
    executor: agent
    deps:
      - confirm_brief
    work:
      objective: 根据已确认的输入生成执行摘要
      inputs:
        - instance_inputs.brief
        - dependencies.confirm_brief
      outputs:
        - id: content
          type: text
      acceptance:
        - 正文包含明确结论和后续行动
        - 正文不虚构未提供的事实
      agent:
        kind: llm.generate
        model_role: default
        instructions: 用中文生成不超过 300 字的执行摘要，包含结论、依据和下一步。

  - key: review_summary
    title: 复核 Agent 执行摘要
    owner_person_id: replace_with_open_id
    executor: human
    deps:
      - draft_summary
    work:
      objective: 复核 Agent 生成的执行摘要并决定是否接受
      inputs:
        - dependencies.draft_summary
      outputs:
        - id: review
          type: data
      acceptance:
        - 已阅读任务描述中的上游结果
        - 已完成接受或退回判断
